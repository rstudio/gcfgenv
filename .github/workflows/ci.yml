name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # "1.25" is the version go.mod declares. Without it the matrix never
        # builds the oldest version this module claims to support, and a use of
        # a newer standard library function passes CI while breaking anyone on
        # that version.
        go: ["1.25", oldstable, stable]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - run: make

    - run: make test

    - run: make check
